name: Update sportocal calendar

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sportocal-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch football fixtures
        run: python scripts/fetch_football.py

      - name: Fetch cycling schedules
        run: python scripts/fetch_cycling.py

      - name: Build combined ICS calendar
        run: python scripts/build_ics.py

      - name: Build website data
        run: python scripts/build_site_data.py

      - name: Commit changes if any
        run: |
          git config user.name "sportocal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ public/
          git diff --staged --quiet || git commit -m "Update calendar data ($(date -u +%Y-%m-%d))"
          git push
          # This push is also what triggers Vercel's automatic redeploy (once
          # the Vercel project is connected to this repo's GitHub App) -- the
          # personalized /api/calendar.ics endpoint reads data/*.json from the
          # deployment bundle, so it only picks up new fixtures after a redeploy.
